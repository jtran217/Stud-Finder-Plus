; Laser station firmware. Build/upload from this folder, picking your board:
;   pio run -e uno -t upload
; (or nano / nano_old / mega / promicro)

[platformio]
default_envs = uno

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200

[env:uno]
board = uno

[env:nano]
board = nanoatmega328new

[env:nano_old]
; Nano clones with the old bootloader
board = nanoatmega328

[env:mega]
board = megaatmega2560

[env:promicro]
board = leonardo
